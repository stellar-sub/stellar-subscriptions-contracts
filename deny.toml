# cargo-deny configuration. CI runs `cargo deny check` (see
# .github/workflows/deny.yml). How to handle a failure is in
# docs/advisories.md.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. Unmaintained and yanked crates fail too, so
# they are looked at rather than ignored by default.
unmaintained = "workspace"
yanked = "deny"
# Add reviewed exceptions here, each with a reason. See docs/advisories.md.
ignore = []

[licenses]
# Permissive licences found across the Soroban SDK tree. A new licence fails
# the build until someone decides whether it is acceptable.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
