name: Deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runs advisories, bans, licenses and sources checks from deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
