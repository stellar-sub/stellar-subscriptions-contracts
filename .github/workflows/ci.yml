name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs exactly the channel, targets and components pinned in
      # rust-toolchain.toml, so CI builds with what contributors use locally.
      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Tests run first so a formatting nit can never hide a failing
      # invariant test.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # The invariant fuzz test runs 48 cases locally. Here it runs far deeper, in
  # its own job so a slow run never hides a failing unit test.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Fuzz CAP, INTERVAL and REVOCATION (500 cases)
        env:
          PROPTEST_CASES: "500"
        run: cargo test -p subscription fuzz

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}

      # Same artifacts as `stellar contract build`, without compiling the
      # Stellar CLI in CI.
      - name: Build contracts (wasm)
        run: cargo build --workspace --release --target wasm32v1-none

      - name: Report wasm sizes
        run: ls -l target/wasm32v1-none/release/*.wasm
