[workspace]
resolver = "2"
members = [
  "contracts/plan",
  "contracts/registry",
  "contracts/subscription",
]

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Deny unwrap, expect, panic in contract code - Issue #83
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
