[package]
name = "subscription"
version = "0.1.0"
edition = "2021"
publish = false
description = "Recurring, capped, revocable pull payments on Soroban"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.5"
# Test-only: deploy the real plan and registry contracts for integration tests.
plan = { path = "../plan", features = ["testutils"] }
registry = { path = "../registry", features = ["testutils"] }
